name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 允许 GITHUB_TOKEN 推送到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

# 时区：不设的话文章日期按 UTC 算，晚上发的文章会变成"昨天"
env:
  HUGO_VERSION: 0.169.0
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 关键：把 Pages 的 source 自动切换为 "GitHub Actions"。
          # 仓库当前是 legacy（Deploy from a branch）模式，不切换的话
          # 系统会用 Jekyll 构建并覆盖本工作流的产物，导致页面 404。
          enablement: true

      - name: Install Hugo (extended)
        run: |
          echo "Installing Hugo extended ${HUGO_VERSION}..."
          # ⚠️ 必须是 extended 版，否则 Stack 主题编译 SCSS 会失败
          curl -sfL --output-dir "${RUNNER_TEMP}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify Hugo version
        run: hugo version

      - name: Build
        run: |
          hugo --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
